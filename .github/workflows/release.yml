name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Test
        shell: pwsh
        run: |
          # 新编译的 exe 偶尔被杀软拦几秒，重试几次再判失败。
          for ($i = 1; $i -le 3; $i++) {
            cmd /c test.cmd
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "test run $i failed with exit $LASTEXITCODE, retrying in 20s"
            Start-Sleep -Seconds 20
          }
          exit 1

      - name: Pack
        shell: pwsh
        run: ./tools/pack.ps1

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $out = New-Object System.Collections.Generic.List[string]
          $in = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($in) { break }
              if ($line -match [regex]::Escape($tag)) { $in = $true; continue }
            } elseif ($in) {
              $out.Add($line)
            }
          }
          $text = ($out -join [Environment]::NewLine).Trim()
          if (-not $text) { $text = "QLock $env:GITHUB_REF_NAME" }
          Set-Content -Path release-notes.md -Value $text -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            dist/QLock.exe
            dist/SHA256SUMS.txt
